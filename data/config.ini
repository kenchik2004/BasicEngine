#iniファイル


[StartConfig]
#フルスクリーン起動するかどうか
full_screen=false

#描画FPSの設定
draw_fps=160

#更新FPSの設定
update_fps=160

#物理更新FPSの設定
fixed_fps=50

#ウィンドウの幅と高さの設定
screen_width=1920
screen_height=1080

#開始シーンの指定
start_scene=NeonFade::SceneTitle

#ゲーム時間のタイムスケール設定
time_scale=1

#ウィンドウ名
window_name=メインウィンドウ

#マウス表示するかどうかの設定
show_mouse=true

#シェーダーのランタイムコンパイルを有効にするかどうか
shader_runtime_compile=false
[Camera]
InvertX=false
InvertY=false
[Audio]
BGMVolume=0.100000
SEVolume=0.100000
[Option]
dead_zone=0.307607

[Game]
police_car_enabled = false

teamed_enemy = true
team_counts = 20
members_per_team = 10
